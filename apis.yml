- aid: contabo:contabo-images-api
  name: Contabo Images API
  description: >-
    The Compute Management API allows you to manage compute resources (e.g. creation, deletion, starting,
    stopping)

    as well as managing snapshots and custom images. It also supports [cloud-init](https://cloud-init.io/)
    at least on our default images

    (for custom images you'll need to provide cloud-init support packages). The API offers providing [cloud-init](https://cloud-init.io/)
    scripts via the `user_data` field.

    Custom images must be provided in .qcow2 or .iso format.

- aid: contabo:contabo-object-storages-api
  name: Contabo Object Storages API
  description: >-
    Manage S3 compatible Object Storage. With the Object Storage API you can create Object Storage in
    different locations. Please note that you can only have one Object Storage per location. Furthermore
    you can increase the amount of storage space and control the autoscaling feature which allows to automatically
    perform a monthly upgrade of the disk space to the specified maximum. You might also inspect the usage.

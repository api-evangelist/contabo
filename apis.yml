aid: contabo
name: Contabo
image: https://cdn.contabo.com/og_fair-priced_EN-1.webp
description: Contabo GmbH is a German hosting provider offering VPS, VDS, dedicated and GPU servers, S3-compatible object storage, private networking, DNS and domains. The Contabo API (https://api.contabo.com,
  OpenAPI 3.0.3, 157 operations) manages compute instances, snapshots, images, object storage, private networks, secrets, users, roles and tags using OAuth2 password-grant bearer tokens from auth.contabo.com;
  Contabo also ships the cntb CLI and a Terraform provider.

openapi: 3.2.0
info:
  title: Contabo Vip Audits API
  version: 1.0.0
  contact:
    email: support@contabo.com
    url: https://contabo.com
  termsOfService: https://contabo.com/en/legal/terms-and-conditions/
  x-logo:
    url: data:image/png;base64,
    altText: Contabo Logo
  description: 'Operations tagged Vip Audits across 2 of this provider''s published API definitions: contabo-api-redoc-embedded.json, contabo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.contabo.com
tags:
- name: Vip Audits
paths:
  /v1/vips/audits:
    get:
      description: List and filters the history about your VIPs.
      operationId: retrieveVipAuditsList
      parameters:
      - name: x-request-id
        in: header
        description: '[Uuid4](https://en.wikipedia.org/wiki/Universally_unique_identifier#Version_4_(random)) to identify individual requests for support cases. You can use [uuidgenerator](https://www.uuidgenerator.net/version4) to generate them manually.'
        required: true
        allowEmptyValue: false
        schema:
          type: string
          example: 04e0f898-37b4-48bc-a794-1a57abe6aa31
          pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-5][0-9A-Fa-f]{3}-[089abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      - name: x-trace-id
        in: header
        description: Identifier to trace group of requests.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Number of page to be fetched.
        schema:
          format: int64
          example: 1
          type: integer
      - name: size
        required: false
        in: query
        description: Number of elements per page.
        schema:
          format: int64
          example: 10
          type: integer
      - name: orderBy
        required: false
        in: query
        description: Specify fields and ordering (ASC for ascending, DESC for descending) in following format `field:ASC|DESC`.
        schema:
          example: name:asc
          type: array
          items:
            type: string
      - name: vipId
        required: false
        in: query
        description: The identifier of the VIP.
        schema:
          example: 1b943b25a-c8b5-4570-9135-4bbaa7615b812345
          type: string
      - name: requestId
        required: false
        in: query
        description: The requestId of the API call which led to the change.
        schema:
          example: D5FD9FAF-58C0-4406-8F46-F449B8E4FEC3
          type: string
      - name: changedBy
        required: false
        in: query
        description: User name which did the change.
        schema:
          example: 23cbb6d6-cb11-4330-bdff-7bb791df2e23
          type: string
      - name: startDate
        required: false
        in: query
        description: Start of search time range.
        schema:
          format: date
          example: '2021-01-01'
          type: string
      - name: endDate
        required: false
        in: query
        description: End of search time range.
        schema:
          format: date
          example: '2021-12-31'
          type: string
      responses:
        '200':
          description: The response will be a JSON object and contains a paginated list of VIPs audits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVipAuditResponse'
      security:
      - bearer: []
      summary: List history about your VIPs (audit)
      tags:
      - Vip Audits
      x-codeSamples:
      - lang: cURL
        source: 'curl -X GET -H "Content-Type: application/json" -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "x-request-id: 51A87ECD-754E-4104-9C54-D01AD0F83406" -H  "x-trace-id: 123213" "https://api.contabo.com/v1/vips/audits"'
      - lang: cntb CLI
        source: cntb history vips
    servers:
    - url: https://api.contabo.com
components:
  schemas:
    Links:
      type: object
      properties:
        self:
          type: string
          description: Link to current resource.
        first:
          type: string
          description: Link to first page, if applicable.
        previous:
          type: string
          description: Link to previous page, if applicable.
        next:
          type: string
          description: Link to next page, if applicable.
        last:
          type: string
          description: Link to last page, if applicable.
      required:
      - self
      - first
      - last
    VipAuditResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The identifier of the audit entry.
          example: '12345'
        vipId:
          type: string
          description: The identifier of the VIP
          example: b943b25a-c8b5-4570-9135-4bbaa7615b81
        action:
          type: string
          enum:
          - CREATED
          - DELETED
          - UPDATED
          description: Type of the action.
          example: CREATED
        timestamp:
          format: date-time
          type: string
          description: When the change took place.
          example: '2021-03-30T11:35:06.177Z'
        tenantId:
          type: string
          minLength: 1
          description: Customer tenant id
          example: DE
        customerId:
          type: string
          minLength: 1
          description: Customer number
          example: '54321'
        changedBy:
          type: string
          minLength: 1
          description: User id
          example: '54321'
        username:
          type: string
          description: User name which did the change.
          example: John Doe
        requestId:
          type: string
          description: The requestId of the API call which led to the change.
          example: A2F56FAF-18N0-4893-11HG-R312M1E4FEC5
        traceId:
          type: string
          description: The traceId of the API call which led to the change.
          example: 78E9A428-94E9-4A2A-92F5-26038C6884F
        changes:
          type: object
          description: List of actual changes.
          example:
            prev:
              name: test
            new:
              name: test1
      required:
      - id
      - vipId
      - action
      - timestamp
      - tenantId
      - customerId
      - changedBy
      - username
      - requestId
      - traceId
    ListVipAuditResponse:
      type: object
      properties:
        _pagination:
          description: Data about pagination like how many results, pages, page size.
          allOf:
          - $ref: '#/components/schemas/PaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/VipAuditResponse'
        _links:
          example:
            first: /v1/vips/audits?page=2
            previous: /v1/vips/audits?page=2
            next: /v1/vips/audits?page=3
            last: /v1/vips/audits?page=10
            self: /v1/vips/audits
          allOf:
          - $ref: '#/components/schemas/Links'
      required:
      - _pagination
      - data
      - _links
    PaginationMeta:
      type: object
      properties:
        size:
          type: number
          example: 10
          description: Number of elements per page.
        totalElements:
          type: number
          example: 100
          description: Number of overall matched elements.
        totalPages:
          type: number
          example: 10
          description: Overall number of pages.
        page:
          type: number
          example: 1
          description: Current number of page.
      required:
      - size
      - totalElements
      - totalPages
      - page
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: 'The Contabo API requires a so called `access_token` which has to be provided in the HTTP request `Authorization` header. The special type is called `Bearer`.


        Thus the header would look like `Authorization: Bearer <access_token>`


        In order to get an `access_token` you need to invoke Contabo''s OAuth2 provider with the credentials you get from the [Customer Control Panel](https://my.contabo.com).

        You will get a response containing an `access_token`.


        Here is how to do it:


        ```sh

        CLIENT_ID=<ClientId from Customer Control Panel>

        CLIENT_SECRET=<ClientSecret from Customer Control Panel>

        API_USER=<API User from Customer Control Panel>

        API_PASSWORD=''<API Password from Customer Control Panel>''

        curl -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" --data-urlencode "username=$API_USER" --data-urlencode "password=$API_PASSWORD" -d ''grant_type=password'' ''https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token''


        ```


        The response would be a complete token with an `access_token`. Please extract it and use it in your HTTP request `Authorization` header. The documentation will show you some examples by using

        the command line. Please note that you can use the `cntb` CLI tool to facilitate invocation.

        '
x-refined-from:
- contabo-api-redoc-embedded.json
- contabo-openapi.yml
